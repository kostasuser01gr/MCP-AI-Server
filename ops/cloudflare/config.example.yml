# Cloudflare Tunnel — Named Tunnel Config
# Copy to: ~/.cloudflared/config.yml
# Docs: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/local-management/configuration-file/

tunnel: mcpserver
credentials-file: /Users/YOUR_USER/.cloudflared/TUNNEL_ID.json

ingress:
  - hostname: mcp.yourdomain.com
    service: http://localhost:3030
  - service: http_status:404
