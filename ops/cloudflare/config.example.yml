# Cloudflare Tunnel configuration for MCP Car Rental
# Copy this file to ~/.cloudflared/config.yml and edit the values below.
#
# Replace:
#   mcpserver        → your tunnel name (from: cloudflared tunnel create <name>)
#   <TUNNEL_ID>      → the UUID printed by: cloudflared tunnel create
#   <YOUR_USER>      → your OS username
#   app.example.com  → your actual domain

tunnel: mcpserver
credentials-file: /Users/<YOUR_USER>/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: app.example.com
    service: http://localhost:3030
  - service: http_status:404
